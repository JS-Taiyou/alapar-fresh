name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt, lint, type-check & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.2

      - name: Format check
        run: deno fmt --check .

      - name: Lint
        run: deno lint .

      # Scoped type-check with REAL npm types via deno.check.jsonc (which
      # omits tailwind/daisyui/vite — the npm registry currently serves
      # corrupted metadata for @tailwindcss/oxide-wasm32-wasi, breaking any
      # install that resolves them; the app runtime never imports them).
      # Covers everything except vite.config.ts. Revert to plain
      # `deno install && deno check` once the registry bug resolves.
      - name: Type-check (scoped)
        run: deno task check:types

      - name: Test
        run: deno test --config deno.test.json --allow-env
