name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt, lint, type-check & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.2

      - name: Install dependencies
        run: deno install

      - name: Format check
        run: deno fmt --check .

      - name: Lint
        run: deno lint .

      - name: Type-check
        run: deno check

      - name: Test
        run: deno test --config deno.test.json --allow-env
